<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A half ring with a thumb on it: a value you drag along a scale. The
       ring is the gauge and the thumb is Fluent's own slider thumb, a ramp
       dot in a ring of the page, so the one mark carries both halves of the
       control.

       The thumb is cut out of the ring by a hole of #F8FAFC rather than drawn
       over it, so at 24 it is still a knob and not a bulge in the arch.

       Rejected on the contact sheet, 3 Oct 2026, beside SLA Timer, Grid Data
       Bars, Star Rating, Sparkline, Chart View, Input Mask, Process Flow and
       Copy Field: a speedometer (the arch with a needle) read clearly but
       said gauge and nothing of dragging; the arch cut into three bands
       closed its gaps at 32 under the round caps and became a plain arch; an
       arc over a slider track went to a lamp at 24; a filled arc with an
       outlined remainder went soft at 24. A straight track with a dot on it
       was not drawn: a pill with a dot is a toggle switch.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="number-slider-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The scale. -->
  <path d="M16 64 A32 32 0 0 1 80 64" stroke="url(#number-slider-ramp)" stroke-width="14" stroke-linecap="round"/>

  <!-- The thumb: a hole, the knob, its centre. -->
  <circle cx="70.6" cy="41.4" r="15" fill="#F8FAFC"/>
  <circle cx="70.6" cy="41.4" r="11" fill="url(#number-slider-ramp)"/>
  <circle cx="70.6" cy="41.4" r="4.5" fill="#F8FAFC"/>
</svg>
