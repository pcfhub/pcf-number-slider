<!DOCTYPE html>
<!--
  The control, rendered in a real browser, for looking at.

      npm run build
      npm run harness -- --no-open --port 8108
      then open http://localhost:8108/dev/preview.html, or run node dev/shots.js

  `dev/smoke.js` loads the same bundle in Node and asserts what the control
  *decided*. This page renders it, which answers what no assertion can: whether
  the thumb sits on the rail, whether the box wraps under the track on a narrow
  column, whether the arc's value sits in its hollow.

  No host publishes a theme here, so every `var(--colorX, fallback)` in the
  stylesheet resolves to its literal fallback: the light theme, or the dark
  fallbacks with ?dark=1. It shows layout and the fallbacks, and nothing about
  a form's own palette.

  Query parameters, all optional:

    ?width=360          each card's width in px
    ?dark=1             the dark fallbacks, on a dark ground
    ?only=a,b           only these cards, by id
    ?locale=de-DE       the user's number format
    ?rtl=1              right to left
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Number Slider — preview</title>
    <link rel="stylesheet" href="../out/controls/NumberSlider/css/NumberSlider.css" />
    <style>
        /* The host page: a form's ground and padding, nothing of the control. */
        body {
            margin: 0;
            padding: 24px;
            background: #f0f0f0;
            font-family: "Segoe UI", sans-serif;
        }
        body.dark {
            background: #0a0a0a;
            color: #fff;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: flex-start;
        }
        .card {
            box-sizing: border-box;
            padding: 16px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .14), 0 0 2px rgba(0, 0, 0, .12);
        }
        .dark .card {
            background: #292929;
        }
        .card h2 {
            margin: 0 0 4px;
            font-size: 12px;
            font-weight: 600;
            color: #616161;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .card .label {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .dark .card h2 {
            color: #adadad;
        }
    </style>
</head>
<body>
    <div class="grid" id="grid"></div>

    <script src="fixture.js"></script>
    <script src="host.js"></script>
    <script>
        // The bundle registers itself on load; catch it before it runs.
        window.__registration = window.__pcfHost.captureRegistration(window);
    </script>
    <script src="../out/controls/NumberSlider/bundle.js"></script>
    <script>
        (function () {
            'use strict';

            var host = window.__pcfHost;
            var params = new URLSearchParams(window.location.search);
            var dark = params.get('dark') === '1';
            var width = Number(params.get('width')) || 360;
            var only = (params.get('only') || '').split(',').filter(Boolean);
            var locale = params.get('locale') || 'en-US';
            var rtl = params.get('rtl') === '1';

            document.body.classList.toggle('dark', dark);

            var INPUTS = { style: 'slider', min: null, max: null, step: null, valueBox: 'show', unit: null, bands: null };
            var SCORE = { column: 'cll_score', valueType: 'Decimal', value: 72.5, minValue: 0, maxValue: 100, precision: 2, label: 'Score' };
            var SEATS_UPPER = { type: 'Whole.None', raw: 400, column: 'cll_maxseats', minValue: 0, maxValue: 500 };

            function merge(base, extra) {
                var out = Object.assign({}, base, extra);

                out.inputs = Object.assign({}, INPUTS, base.inputs, extra && extra.inputs);

                return out;
            }

            var STATES = [
                { id: 'slider', title: 'Slider', options: merge(SCORE, { inputs: { step: 0.5 } }) },
                { id: 'budget', title: 'Currency, step 1,000', options: merge({ column: 'revenue', valueType: 'Currency', value: 250000, minValue: 0, maxValue: 1000000, precision: 2, label: 'Budget' }, { inputs: { step: 1000 } }) },
                { id: 'bands', title: 'Bands, a unit', options: merge(SCORE, { label: 'Probability', value: 85, inputs: { unit: '%', bands: '50 danger; 80 warning; 100 success' } }) },
                { id: 'range', title: 'Range', options: merge({ column: 'cll_minseats', valueType: 'Whole.None', value: 10, minValue: 0, maxValue: 500, label: 'Seats' }, { inputs: { style: 'range' }, bound: { upperValue: SEATS_UPPER } }) },
                { id: 'stepper', title: 'Stepper', options: merge({ column: 'cll_quantity', valueType: 'Whole.None', value: 3, minValue: 0, maxValue: 10, label: 'Quantity' }, { inputs: { style: 'stepper' } }) },
                { id: 'bar', title: 'Bar gauge', options: merge(SCORE, { label: 'Health', value: 42, inputs: { style: 'bar', unit: '%', bands: '30 danger; 60 warning; 100 success' } }) },
                { id: 'arc', title: 'Arc gauge', options: merge(SCORE, { inputs: { style: 'arc' } }) },
                { id: 'readOnly', title: 'Read-only form', options: merge(SCORE, { disabled: true }) },
                { id: 'empty', title: 'Empty column', options: merge(SCORE, { value: null }) },
                { id: 'outside', title: 'Saved value outside the range', options: merge(SCORE, { value: 150, maxValue: 500, inputs: { max: 100 } }) },
                { id: 'noBox', title: 'No value box', options: merge(SCORE, { inputs: { valueBox: 'hide' } }) },
                { id: 'unmapped', title: 'Range, no second column', options: merge({ column: 'cll_minseats', valueType: 'Whole.None', value: 10, minValue: 0, maxValue: 500, label: 'Seats' }, { inputs: { style: 'range' }, bound: { upperValue: 'unmapped' } }) },
            ];

            var grid = document.getElementById('grid');

            /* Real strings: the 1033 .resx's text where it has a key. */
            var strings = {};

            fetch('../NumberSlider/strings/NumberSlider.1033.resx')
                .then(function (r) { return r.text(); })
                .then(function (xml) {
                    var doc = new DOMParser().parseFromString(xml, 'application/xml');

                    Array.prototype.forEach.call(doc.querySelectorAll('data'), function (node) {
                        strings[node.getAttribute('name')] = node.querySelector('value').textContent;
                    });
                })
                .catch(function () {})
                .then(function () {
                    STATES.filter(function (s) { return only.length === 0 || only.indexOf(s.id) !== -1; }).forEach(mount);
                });

            function mount(state) {
                var card = document.createElement('section');
                var heading = document.createElement('h2');
                var label = document.createElement('p');
                var container = document.createElement('div');

                card.className = 'card';
                card.id = state.id;
                card.style.width = width + 'px';
                heading.textContent = state.title;
                label.className = 'label';
                label.textContent = state.options.label;
                card.append(heading, label, container);
                grid.append(card);

                var options = Object.assign({
                    clientUrl: host.nextClientUrl(),
                    dark: dark,
                    rtl: rtl,
                    locale: locale,
                    host: 'model-driven',
                    typeGroup: ['Whole.None', 'Decimal', 'FP', 'Currency'],
                    getString: function (key) { return strings[key] !== undefined ? strings[key] : key; },
                }, state.options);
                var instance = new window.__registration.ctor();

                instance.init(host.createContext(options), function () {}, {}, container);
                instance.updateView(host.createContext(options));
                window.__instances = window.__instances || {};
                window.__instances[state.id] = instance;
            }
        })();
    </script>
</body>
</html>
